# Journal Kanban Dashboard
# Generated by dashboard_vrtl — dashboard-as-code
dashboard:
  key: journal_kanban
  name: Journal Kanban
  icon: fa-book
  category: Finance
  auto_refresh: 300000
  cache_ttl: 300

metrics:
  - key: account.journals
    label: Account Journals
    source_type: service
    service_model: dashboard.source.account.journals
    service_method: get_data
    unit: float
    kanban:
      state_field: state
      state_colors:
        active: "#28a745"
        locked: "#6c757d"
      state_icons:
        active: fa-check-circle
        locked: fa-lock
      card_title_field: name
      card_subtitle_field: type
      card_body_fields:
        - pending_moves
        - balance
      card_footer_fields:
        - last_activity
      card_actions:
        - name: new_move
          label: New Entry
          icon: fa-plus
          action: ir.actions.act_window
          params:
            res_model: account.move
            views:
              - [false, form]
            context:
              default_journal_id: "{id}"
        - name: view_journal
          label: Open Journal
          icon: fa-book
          action: ir.actions.act_window
          params:
            res_model: account.journal
            res_id: "{id}"
            views:
              - [false, form]
      group_field: type

  - key: account.total_pending_moves
    label: Total Pending Moves
    source_type: model
    model: account.move
    field: id
    aggregation: count
    domain:
      - ["state", "=", "draft"]
    unit: integer

  - key: account.total_journals
    label: Active Journals
    source_type: model
    model: account.journal
    field: id
    aggregation: count
    domain:
      - ["active", "=", true]
    unit: integer

filters:
  - key: company
    label: Company
    type: companies
    default: current_company

charts:
  - key: journals_kanban
    label: Journals
    metric: account.journals
    type: kanban
    layout:
      x: 0
      y: 0
      w: 12
      h: 5

  - key: kpi_pending_moves
    label: Pending Moves
    metric: account.total_pending_moves
    type: kpi
    layout:
      x: 0
      y: 5
      w: 3
      h: 2

  - key: kpi_active_journals
    label: Active Journals
    metric: account.total_journals
    type: kpi
    layout:
      x: 3
      y: 5
      w: 3
      h: 2

layout:
  - chartId: journals_kanban
    x: 0
    y: 0
    w: 12
    h: 5
  - chartId: kpi_pending_moves
    x: 0
    y: 5
    w: 3
    h: 2
  - chartId: kpi_active_journals
    x: 3
    y: 5
    w: 3
    h: 2
