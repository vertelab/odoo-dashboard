dashboard:
  key: sales_executive
  name: "Sales Executive Dashboard"
  name_sv: "Säljöversikt"
  description: "Daglig översikt — omsättning, pipeline och teamets prestationer."
  icon: fa-chart-line
  category: Sales
  auto_refresh: 300000
  cache_ttl: 300

filters:
  - key: period
    type: date_range
    label: "Period"
    label_sv: "Period"
    optional: false
    default:
      from: this_year_start
      to: today
    shortcuts:
      - label: "Denna månad"
        from: this_month_start
        to: today
      - label: "Senaste kvartalet"
        from: this_quarter_start
        to: today
      - label: "Rullande 12 mån"
        from: 12_months_ago
        to: today

metrics:
  - key: sales.net_revenue
    label: "Net Revenue"
    label_sv: "Nettoomsättning"
    source_type: model
    model: sale.order
    field: amount_total
    aggregation: sum
    unit: monetary
    date_field: date_order
    domain:
      - [state, not in, [draft, cancel, sent]]

  - key: sales.orders_count
    label: "Number of Orders"
    label_sv: "Antal ordrar"
    source_type: model
    model: sale.order
    field: id
    aggregation: count
    unit: integer
    date_field: date_order
    domain:
      - [state, not in, [draft, cancel, sent]]

  - key: sales.top_products
    label: "Top Products"
    label_sv: "Mest sålda produkter"
    source_type: model
    model: sale.order.line
    field: price_subtotal
    aggregation: sum
    unit: monetary
    date_field: order_id.date_order
    domain:
      - [order_id.state, not in, [draft, cancel, sent]]
      - [product_id, "!=", false]

charts:
  - key: kpi_revenue
    type: kpi
    metric: sales.net_revenue
    label: "Omsättning"
    comparison: previous_period
    layout: {x: 0, y: 0, w: 3, h: 2}

  - key: kpi_orders
    type: kpi
    metric: sales.orders_count
    label: "Ordrar"
    layout: {x: 3, y: 0, w: 2, h: 2}

  - key: chart_revenue_trend
    type: line_chart
    metric: sales.net_revenue
    label: "Omsättning — trend"
    layout: {x: 0, y: 2, w: 6, h: 4}
    config:
      group_by: date_order:month

  - key: chart_top_products
    type: bar_chart
    metric: sales.top_products
    label: "Topp 5 produkter"
    layout: {x: 0, y: 6, w: 4, h: 4}
    config:
      group_by: product_id
      limit: 5
      sort: desc
