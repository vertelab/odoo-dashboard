dashboard:
  key: cfo_daily
  name: CFO Daily Dashboard
  name_sv: CFO Daglig Översikt
  description: Daglig finansiell översikt — intäkter, kostnader, bank, AR/AP, och avvikelser.
  icon: fa-calculator
  category: Finance
  auto_refresh: 900000
  cache_ttl: 900

filters:
  - key: period
    type: date_range
    label: Period
    default:
      from: this_month_start
      to: today

metrics:
  - key: finance.revenue
    label: Revenue
    source_type: model
    model: account.move.line
    field: credit
    aggregation: sum
    unit: monetary
    date_field: date
    domain:
      - [parent_state, "=", posted]
      - [account_id.account_type, in, [income, income_other]]

  - key: finance.expenses
    label: Expenses
    source_type: model
    model: account.move.line
    field: debit
    aggregation: sum
    unit: monetary
    date_field: date
    domain:
      - [parent_state, "=", posted]
      - [account_id.account_type, in, [expense, expense_depreciation, expense_direct_cost]]

  - key: finance.bank_balance
    label: Bank Balance
    source_type: model
    model: account.move.line
    field: balance
    aggregation: sum
    unit: monetary
    domain:
      - [parent_state, "=", posted]
      - [account_id.account_type, in, [asset_cash, liability_credit_card]]

  - key: finance.ar_total
    label: AR Total
    source_type: model
    model: account.move.line
    field: balance
    aggregation: sum
    unit: monetary
    domain:
      - [parent_state, "=", posted]
      - [account_id.account_type, "=", asset_receivable]
      - [reconciled, "=", false]

  - key: finance.ap_total
    label: AP Total
    source_type: model
    model: account.move.line
    field: balance
    aggregation: sum
    unit: monetary
    domain:
      - [parent_state, "=", posted]
      - [account_id.account_type, "=", liability_payable]
      - [reconciled, "=", false]

  - key: finance.draft_invoices
    label: Draft Invoices
    source_type: model
    model: account.move
    field: id
    aggregation: count
    unit: integer
    domain:
      - [state, "=", draft]
      - [move_type, in, [out_invoice, out_refund, in_invoice, in_refund]]

  - key: finance.late_invoices
    label: Late Invoices
    source_type: model
    model: account.move
    field: id
    aggregation: count
    unit: integer
    domain:
      - [state, "=", posted]
      - [payment_state, in, [not_paid, partial]]
      - [invoice_date_due, "<", today_approx]

charts:
  - key: kpi_revenue
    type: kpi
    metric: finance.revenue
    label: Intäkter
    comparison: previous_period
    layout: {x: 0, y: 0, w: 2, h: 2}

  - key: kpi_expenses
    type: kpi
    metric: finance.expenses
    label: Kostnader
    layout: {x: 2, y: 0, w: 2, h: 2}

  - key: kpi_bank
    type: kpi
    metric: finance.bank_balance
    label: Bank
    layout: {x: 4, y: 0, w: 2, h: 2}

  - key: kpi_ar
    type: kpi
    metric: finance.ar_total
    label: AR
    layout: {x: 6, y: 0, w: 2, h: 2}

  - key: kpi_ap
    type: kpi
    metric: finance.ap_total
    label: AP
    layout: {x: 8, y: 0, w: 2, h: 2}

  - key: kpi_late
    type: kpi
    metric: finance.late_invoices
    label: Late Invoices
    layout: {x: 10, y: 0, w: 2, h: 2}

  - key: chart_revenue_expenses
    type: line_chart
    metric: finance.revenue
    label: Revenue vs Expenses
    layout: {x: 0, y: 2, w: 6, h: 4}
    config:
      group_by: date:month

  - key: chart_ar_aging
    type: table
    metric: finance.ar_total
    label: AR Aging Summary
    layout: {x: 6, y: 2, w: 6, h: 4}

layout:
  - chartId: kpi_revenue
    x: 0
    y: 0
    w: 2
    h: 2
  - chartId: kpi_expenses
    x: 2
    y: 0
    w: 2
    h: 2
  - chartId: kpi_bank
    x: 4
    y: 0
    w: 2
    h: 2
  - chartId: kpi_ar
    x: 6
    y: 0
    w: 2
    h: 2
  - chartId: kpi_ap
    x: 8
    y: 0
    w: 2
    h: 2
  - chartId: kpi_late
    x: 10
    y: 0
    w: 2
    h: 2
  - chartId: chart_revenue_expenses
    x: 0
    y: 2
    w: 6
    h: 4
  - chartId: chart_ar_aging
    x: 6
    y: 2
    w: 6
    h: 4
