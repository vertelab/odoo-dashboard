dashboard:
  key: department_spend
  name: Department Spend
  name_sv: Avdelningskostnader
  icon: fa-sitemap
  category: Finance
  auto_refresh: 1800000
  cache_ttl: 900

filters:
  - key: period
    type: date_range
    label: Period
    default:
      from: this_month_start
      to: today
  - key: department
    type: many2one
    label: Department
    model: account.analytic.account

metrics:
  - key: finance.dept_expenses
    label: Department Expenses
    source_type: model
    model: account.move.line
    field: debit
    aggregation: sum
    unit: monetary
    date_field: date
    domain:
      - [parent_state, "=", posted]
      - [account_id.account_type, in, [expense, expense_depreciation, expense_direct_cost]]

  - key: finance.dept_budget_remaining
    label: Budget Remaining
    source_type: model
    model: account.move.line
    field: debit
    aggregation: sum
    unit: monetary
    date_field: date
    domain:
      - [parent_state, "=", posted]
      - [account_id.account_type, in, [expense, expense_depreciation, expense_direct_cost]]

  - key: finance.dept_headcount
    label: Department Headcount
    source_type: model
    model: hr.employee
    field: id
    aggregation: count
    unit: integer
    domain:
      - [active, "=", true]

  - key: finance.vendor_spend
    label: Vendor Spend
    source_type: model
    model: account.move.line
    field: debit
    aggregation: sum
    unit: monetary
    date_field: date
    domain:
      - [parent_state, "=", posted]
      - [account_id.account_type, in, [expense, expense_direct_cost]]
      - [partner_id, "!=", false]

charts:
  - key: kpi_budget
    type: kpi
    metric: finance.dept_budget_remaining
    label: Expenses MTD
    layout: {x: 0, y: 0, w: 3, h: 2}

  - key: kpi_variance
    type: kpi
    metric: finance.dept_expenses
    label: Variance
    comparison: previous_period
    layout: {x: 3, y: 0, w: 3, h: 2}

  - key: kpi_headcount
    type: kpi
    metric: finance.dept_headcount
    label: Headcount
    layout: {x: 6, y: 0, w: 3, h: 2}

  - key: kpi_vendor
    type: kpi
    metric: finance.vendor_spend
    label: Vendor Spend
    layout: {x: 9, y: 0, w: 3, h: 2}

  - key: chart_expenses_cat
    type: treemap_chart
    metric: finance.dept_expenses
    label: Expenses by Category
    layout: {x: 0, y: 2, w: 6, h: 4}
    config:
      group_by: account_id

  - key: chart_monthly_trend
    type: line_chart
    metric: finance.dept_expenses
    label: Monthly Trend
    layout: {x: 6, y: 2, w: 6, h: 4}
    config:
      group_by: date:month

layout:
  - chartId: kpi_budget
    x: 0
    y: 0
    w: 3
    h: 2
  - chartId: kpi_variance
    x: 3
    y: 0
    w: 3
    h: 2
  - chartId: kpi_headcount
    x: 6
    y: 0
    w: 3
    h: 2
  - chartId: kpi_vendor
    x: 9
    y: 0
    w: 3
    h: 2
  - chartId: chart_expenses_cat
    x: 0
    y: 2
    w: 6
    h: 4
  - chartId: chart_monthly_trend
    x: 6
    y: 2
    w: 6
    h: 4
